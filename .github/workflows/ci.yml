name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check no msfa identifiers
        # Case-sensitive: guards against copied MSFA code (lowercase `msfa`
        # namespace / `src/msfa/` include paths) while allowing the uppercase
        # "MSFA" attribution required by Apache-2.0 (see NOTICE).
        #
        # Attribution path-citations are allowed: a comment line (//, ///, *,
        # /*) that references the upstream (dexed / MSFA / NOTICE). The one
        # verbatim Apache-2.0 table copy (kLFOSpeedHz) is documented in NOTICE
        # and cites `Source/msfa/lfo.cc`; that is provenance, not pasted code.
        # Bare lowercase `msfa` in code, or in a non-attribution comment, fails.
        run: |
          matches=$(grep -rn "msfa" Sources/ \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(///?|\*|/\*).*(dexed|MSFA|NOTICE)' \
            || true)
          if [ -n "$matches" ]; then
            echo "ERROR: lowercase 'msfa' found outside an allowed attribution comment:"
            echo "$matches"
            exit 1
          fi
