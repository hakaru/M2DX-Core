name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check no msfa identifiers
        # Case-sensitive: guards against copied MSFA code identifiers (lowercase
        # `msfa` namespace / `src/msfa/` paths) while allowing the uppercase
        # "MSFA" attribution required by Apache-2.0 (see NOTICE).
        run: |
          if grep -rn "msfa" Sources/; then
            echo "ERROR: lowercase 'msfa' identifiers found in source code"
            exit 1
          fi
